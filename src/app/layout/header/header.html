<header
    class="header bg-white border-bottom px-4 d-flex align-items-center justify-content-between sticky-top shadow-sm"
    style="height: var(--header-height); z-index: 1020;">
    <div class="d-flex align-items-center gap-3">
        <button (click)="onToggle()"
            class="btn btn-light border-0 rounded-3 shadow-sm d-flex align-items-center justify-content-center p-2">
            <i class="pi pi-bars fs-5 text-dark"></i>
        </button>

        <div class="search-bar position-relative d-none d-md-flex align-items-center" style="width: 400px;">
            <i class="pi pi-search position-absolute start-0 ms-3 text-muted"></i>
            <input type="text" class="form-control border-light-subtle bg-light rounded-pill ps-5 py-2 small"
                placeholder="Search for stock, orders, etc..." />
        </div>
    </div>

    <div class="actions d-flex align-items-center gap-4">
        <button class="btn btn-link link-secondary position-relative p-1">
            <i class="pi pi-bell fs-5"></i>
            <span
                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger border border-2 border-white small"
                style="padding: 0.35em 0.5em; font-size: 0.6rem;">
                3
            </span>
        </button>

        <div class="user-profile position-relative">
            <div class="d-flex align-items-center gap-2 p-1 pe-2 rounded-3 cursor-pointer transition-all hover-bg-light"
                (click)="toggleDropdown()" style="cursor: pointer;">
                <div class="user-info d-none d-sm-flex flex-column">
                    <span class="name fw-bold text-dark small">{{ user().role }}</span>
                    <span class="role text-muted" style="font-size: 0.7rem;">Administrator</span>
                </div>
                <i class="pi pi-chevron-down text-muted ms-1 d-none d-sm-block transition-transform"
                    [class.pi-chevron-up]="isDropdownOpen" style="font-size: 0.7rem;"></i>
            </div>

            @if (isDropdownOpen) {
            <div class="dropdown-menu dropdown-menu-end shadow-sm border-0 position-absolute show"
                style="top: 100%; right: 0; min-width: 180px; display: block; z-index: 1050; margin-top: 0.5rem;">
                <a class="dropdown-item d-flex align-items-center gap-2 py-2 small" href="javascript:void(0)">
                    <i class="pi pi-user text-muted"></i> Profile
                </a>
                <a class="dropdown-item d-flex align-items-center gap-2 py-2 small" href="javascript:void(0)">
                    <i class="pi pi-cog text-muted"></i> Settings
                </a>
                <div class="dropdown-divider"></div>
                <button
                    class="dropdown-item d-flex align-items-center gap-2 py-2 text-danger small bg-transparent border-0 w-100 text-start"
                    (click)="logout()">
                    <i class="pi pi-sign-out"></i> Logout
                </button>
            </div>
            }
        </div>
    </div>
</header>
